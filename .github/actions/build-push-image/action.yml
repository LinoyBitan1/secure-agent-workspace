name: Build and push image
description: >-
  Shared tail for the container image builds: buildx setup, ghcr.io login, and a
  gated build/push (push only off pull_request) with GitHub Actions layer cache.
  Callers do their own checkout / values.yaml read / upstream clone as normal
  steps before calling this.

inputs:
  image_name:
    description: Image name published under ghcr.io/<owner>/
    required: true
  context:
    description: Build context path
    required: true
  dockerfile:
    description: Dockerfile path. Empty -> <context>/Dockerfile.
    required: false
    default: ""
  build_args:
    description: Newline-separated docker build args
    required: false
    default: ""
  cache_scope:
    description: GitHub Actions cache scope for this image
    required: true
  registry_token:
    description: Token for ghcr.io login (pass secrets.GITHUB_TOKEN)
    required: true

runs:
  using: composite
  steps:
    - name: Lowercase image owner
      id: meta
      shell: bash
      run: echo "owner=${OWNER,,}" >> "$GITHUB_OUTPUT"
      env:
        OWNER: ${{ github.repository_owner }}

    - uses: docker/setup-buildx-action@v3

    - name: Log in to ghcr.io
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.registry_token }}

    - name: Build and push ${{ inputs.image_name }}
      uses: docker/build-push-action@v6
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.dockerfile }}
        build-args: ${{ inputs.build_args }}
        push: ${{ github.event_name != 'pull_request' }}
        tags: |
          ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image_name }}:latest
          ghcr.io/${{ steps.meta.outputs.owner }}/${{ inputs.image_name }}:sha-${{ github.sha }}
        cache-from: type=gha,scope=${{ inputs.cache_scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache_scope }},ignore-error=true
        provenance: false
