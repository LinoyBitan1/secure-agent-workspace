# Integrations VM — gateway-only, proxy sandboxes deployed post-setup.
sandboxName: saw-integ
role: integrations

containerRuntime: podman
onboardCli: openclaw

openshell:
  gatewayImage: "ghcr.io/nvidia/openshell/gateway:0.0.110"
  supervisorImage: "ghcr.io/nvidia/openshell/supervisor:0.0.110"
  version: "0.0.110"
  pipIndexUrl: ""

vm:
  cores: 2
  memory: 4Gi
  diskSize: 40Gi

route:
  enabled: false
  dashboard: false
  webui: false

dashboard:
  enabled: false

governance:
  enabled: false

service:
  extraPorts:
    - name: mail-read
      port: 18080
      targetPort: 18080
    - name: mail-write
      port: 18081
      targetPort: 18081
    - name: m365-read
      port: 18082
      targetPort: 18082
    - name: inference-proxy
      port: 18083
      targetPort: 18083
    - name: slack-read
      port: 18084
      targetPort: 18084
    - name: slack-write
      port: 18085
      targetPort: 18085
    - name: m365-write
      port: 18086
      targetPort: 18086

networkPolicy:
  peerLabel: openshell-saw
  allowedPorts:
    - 18080
    - 18081
    - 18082
    - 18083
    - 18084
    - 18085
    - 18086
