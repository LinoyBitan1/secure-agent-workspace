# One entry per person. Push this file and Argo CD creates saw-<name>.
# The chart cannot create Keycloak users or Vault entries.
# ownerSubject is the Keycloak subject from `openshell whoami`. Leave it
# empty until that person has logged in once.
users:
  - name: alice
    profiles:
      - data-science
    # Throwaway live-test wiring for handoff item 4 (stdio MCP secret).
    # additionalProviderSecrets replaces the chart default list, so web-search
    # must be repeated here. NOT for production.
    values:
      additionalProviderSecrets:
        - web-search
        - saw-test-secret
