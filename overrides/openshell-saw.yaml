# Per-user sandbox configuration.
# Only the owner is required — all other values use defaults from values.yaml.
accessControl:
  owner: alice

job:
  waitForSecrets: true
  backoffLimit: 5

# Use the locally built CLI ImageStream so the VM receives the compatibility
# patch that makes NemoClaw honor NEMOCLAW_GATEWAY_PORT during preflight.
# The setup chart installs the service CA and grants anonymous image-pull
# access when internalRegistry.allowAnonymousPull is enabled below.
nemoclawCliImage: "image-registry.openshift-image-registry.svc.cluster.local:5000/openshell-agents/nemoclaw-cli:latest"

internalRegistry:
  allowAnonymousPull: true

dashboard:
  insecureSkipIssuerTlsVerify: true
