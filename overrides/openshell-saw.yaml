# Per-user sandbox configuration.
# Only the owner is required — all other values use defaults from values.yaml.
accessControl:
  owner: alice

job:
  waitForSecrets: true
  backoffLimit: 5

nemoclawCliImage: "quay.io/rh-ee-lbitan/nemoclaw-cli:latest"

dashboard:
  insecureSkipIssuerTlsVerify: true
