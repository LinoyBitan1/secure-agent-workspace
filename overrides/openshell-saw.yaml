# Agent VM — runs OpenClaw sandbox, no real provider credentials.
accessControl:
  owner: alice

role: agent
containerRuntime: podman

job:
  backoffLimit: 5

nemoclawCliImage: "quay.io/rh-ai-quickstart/nemoclaw-cli:latest"

openshell:
  gatewayImage: "ghcr.io/nvidia/openshell/gateway:0.0.110"
  supervisorImage: "ghcr.io/nvidia/openshell/supervisor:0.0.110"
  version: "0.0.110"
  pipIndexUrl: ""

governance:
  enabled: false

dashboard:
  enabled: false

additionalProviderSecrets:
  - inter-vm-bearer

networkPolicy:
  peerLabel: ""
