# Per-user sandbox configuration.
# Only the owner is required — all other values use defaults from values.yaml.
accessControl:
  owner: alice

job:
  waitForSecrets: true
  backoffLimit: 5

# Use the namespace-local ImageStream built by the NemoClaw image-builder chart.
# This keeps setup on the same patched CLI image that was validated in-cluster.
nemoclawCliImage: ""

internalRegistry:
  allowAnonymousPull: true

dashboard:
  insecureSkipIssuerTlsVerify: true
