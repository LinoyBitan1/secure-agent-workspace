# Agent VM — runs OpenClaw sandbox, no real provider credentials.
accessControl:
  owner: alice

role: agent
containerRuntime: docker

job:
  backoffLimit: 5

nemoclawCliImage: "quay.io/rh-ai-quickstart/nemoclaw-cli:latest"

openshell:
  gatewayImage: "ghcr.io/nvidia/openshell/gateway:0.0.103"
  supervisorImage: "ghcr.io/nvidia/openshell/supervisor:0.0.103"
  version: "0.0.103"
  pipIndexUrl: ""

governance:
  enabled: false

dashboard:
  enabled: false

networkPolicy:
  peerLabel: openshell-saw-integ
  allowedPorts:
    - 18080
    - 18081
    - 18082
    - 18083
