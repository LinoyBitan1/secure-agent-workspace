version: "2.0"
backingStore: vault
secrets:
  - name: inference
    # Isolated TP test credentials; the shared NVIDIA secret stays intact.
    vaultPrefixes:
      - hub/saw-tp-api-clean
    fields:
      - name: provider
        value: codex
      - name: model
        value: gpt-6-luna
      - name: api_key
        path: ~/.openai-api-key
