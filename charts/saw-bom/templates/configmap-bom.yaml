{{- /* SAW-BOM profiles only. The installer (apply_bom.py) ships with the
     openshell-saw chart and is versioned with its InstallerBOM. */ -}}
{{- $profileFiles := dict }}
{{- range $profile := .Values.profiles }}
{{- $files := $.Files.Glob (printf "profiles/%s/**/*.yaml" $profile) }}
{{- range $path, $_ := $files }}
{{- $_ := set $profileFiles $path ($.Files.Get $path) }}
{{- end }}
{{- end }}
{{- /* Harness bundles: charts/saw-bom/harness/<bundle>/<relpath>. Content is
     base64 per key -- a `|` block scalar normalises trailing whitespace, which
     would change the tree digest between Git and the guest. */ -}}
{{- $harness := dict }}
{{- $digestLines := dict }}
{{- $payload := 0 }}
{{- range $path, $_ := $.Files.Glob "harness/**" }}
{{- $content := $.Files.Get $path }}
{{- $parts := splitList "/" $path }}
{{- if lt (len $parts) 3 }}
{{- fail (printf "harness file %q is not inside a bundle directory; expected harness/<bundle>/<path>" $path) }}
{{- end }}
{{- range $seg := (slice $parts 1) }}
{{- if contains "__" $seg }}
{{- fail (printf "harness path segment %q contains \"__\", the flat-key separator" $seg) }}
{{- end }}
{{- end }}
{{- $bundle := index $parts 1 }}
{{- $rel := join "/" (slice $parts 2) }}
{{- $key := printf "harness__%s" (join "__" (slice $parts 1)) }}
{{- /* KubeVirt renders this ConfigMap as an iso9660 disk; Joliet caps
     filenames at 64 characters. */ -}}
{{- if gt (len $key) 64 }}
{{- fail (printf "harness ConfigMap key is %d chars (iso9660/Joliet limit is 64): %s" (len $key) $key) }}
{{- end }}
{{- $_ := set $harness $key (b64enc $content) }}
{{- $payload = add $payload (len (b64enc $content)) }}
{{- $_ := set $digestLines $bundle (printf "%s%s\x00%s\n" (default "" (get $digestLines $bundle)) $rel (sha256sum $content)) }}
{{- end }}
{{- $digests := dict }}
{{- range $bundle, $text := $digestLines }}
{{- $_ := set $digests $bundle (printf "sha256:%s" (sha256sum $text)) }}
{{- end }}
{{- if gt $payload 921600 }}
{{- fail (printf "harness payload is %d bytes (>900KiB); the ConfigMap limit is 1MiB" $payload) }}
{{- end }}
{{- /* Every bundled tool must name an enrolled governance profile. */ -}}
{{- range $path, $_ := $.Files.Glob "harness/*/harness.yaml" }}
{{- $doc := $.Files.Get $path | fromYaml }}
{{- range $tool := (($doc.spec).tools | default list) }}
{{- if not (has ($tool.governanceProfile | default "") $.Values.governanceProfiles) }}
{{- fail (printf "harness tool %q names governanceProfile %q, which is not enrolled (saw-bom values.governanceProfiles)" $tool.name ($tool.governanceProfile | default "")) }}
{{- end }}
{{- end }}
{{- end }}
{{- /* Every selected profile's harnessRef must match the computed digest. */ -}}
{{- range $profile := $.Values.profiles }}
{{- range $path, $_ := $.Files.Glob (printf "profiles/%s/**/sandbox.yaml" $profile) }}
{{- range $sb := ((($.Files.Get $path | fromYaml).spec).sandboxes | default list) }}
{{- if $sb.harnessRef }}
{{- $want := $sb.harnessRef.digest | default "" }}
{{- $got := get $digests ($sb.harnessRef.name | default "") }}
{{- if not $got }}
{{- fail (printf "sandbox %q references unknown harness bundle %q" $sb.name ($sb.harnessRef.name | default "")) }}
{{- end }}
{{- if ne $want $got }}
{{- fail (printf "harnessRef digest mismatch for sandbox %q: sandbox.yaml says %q, the bundle hashes to %q" $sb.name $want $got) }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- end }}
{{- if or $profileFiles $harness }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: saw-bom-profiles
  labels:
    app.kubernetes.io/name: saw-bom
    app.kubernetes.io/instance: {{ .Release.Name }}
data:
  {{- range $path, $content := $profileFiles }}
  {{ $path | replace "/" "__" }}: |
{{ $content | indent 4 }}
  {{- end }}
  {{- range $key, $b64 := $harness }}
  {{ $key }}: {{ $b64 | quote }}
  {{- end }}
  {{- if $harness }}
  harness-index.yaml: |
    bundles:
    {{- range $bundle, $digest := $digests }}
      {{ $bundle }}: {{ $digest }}
    {{- end }}
    enrolledGovernanceProfiles:
    {{- range $p := $.Values.governanceProfiles }}
      - {{ $p }}
    {{- end }}
  {{- end }}
{{- end }}
