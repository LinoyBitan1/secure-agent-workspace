# Active profiles to deploy on the Agent VM.
profiles:
  - data-science

# Active profiles to deploy on the Integrations VM (two-VM split only).
# Each profile maps to one OpenShell workspace with its own provider/credential.
# Leave empty to skip integrations VM provisioning.
integrationsProfiles:
  - integrations

# Default process identity for BOM-created sandboxes.
# Can be overridden per-sandbox via runAsUser/runAsGroup in sandbox.yaml.
sandboxPolicy:
  defaultRunAsUser: "1001"
  defaultRunAsGroup: "1001"

# OpenClaw notebook identity override (templated into data-science profile).
openclawNotebook:
  runAsUser: "1000"
  runAsGroup: "1000"
