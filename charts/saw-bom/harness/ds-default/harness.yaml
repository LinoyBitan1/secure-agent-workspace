apiVersion: saw.redhat.com/v1alpha1
kind: HarnessBundle
metadata:
  name: ds-default
spec:
  agent: openclaw
  version: 0.1.0
  # Mounted read-only at /sandbox/harness exactly as it is: OpenClaw loads the
  # Agent Plugins bundle at the root (plugin.json, skills/, mcp.json) and the
  # native tool plugins under plugins/. This file is read only by the
  # installer, for governance.
  #
  # Governance: a plugin that makes network calls, and every remote
  # (streamable-http / sse) server in mcp.json, names the provider profile
  # whose endpoints allow its hosts.
  plugins: []
  #  - name: my-plugin
  #    governanceProfile: <profile>
  mcpServers:
    # Throwaway live-test declaration for handoff item 4 (stdio MCP secret).
    # NOT for production.
    - name: saw-env-echo
      credentialSecret: saw-test-secret
      credentialSecretKey: api_key
      credentialEnvVar: SAW_TEST_API_KEY
  #  - name: web-search
  #    governanceProfile: web-search
