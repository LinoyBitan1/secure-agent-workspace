apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: notebook
      type: openclaw
      enabled: true
      image: quay.io/rh-ai-quickstart/openclaw-openshell:latest
      providers:
        - nvidia
        - brave
      # The harness bundle is mounted read-only at /sandbox/harness, as is,
      # from a volume the installer fills; an update refills it in place:
      #   harnessRef: {name: <bundle>}   inline, from charts/saw-bom/harness/
      #                                  (digest: optional, checked when set)
      #   harnessRef: {image: ghcr.io/<owner>/saw-harness-<bundle>@sha256:<digest>}
      #                                  published by CI from harness-bundles/
      harnessRef:
        image: ghcr.io/linoybitan1/saw-harness-ds-default@sha256:71386b4572c75f6a404d955ca46b31b61852a34f517fabc2333dcf1332818f3b
    - name: cuda-sandbox
      type: nemoclaw
      enabled: false
      agent: openclaw
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox:latest
      providers:
        - nvidia
    - name: toolbox
      type: generic
      enabled: false
      image: base
      providers:
        - nvidia
