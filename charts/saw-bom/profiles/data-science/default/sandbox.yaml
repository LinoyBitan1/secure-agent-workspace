apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: notebook
      type: openclaw
      enabled: true
      image: quay.io/rh-ai-quickstart/openclaw-openshell:latest
      providers:
        - nvidia
      harnessRef:
        name: ds-default
        digest: sha256:52d484f1ca05d55fd704d00c1c74a85539586b078b3c7d8e11a2ed8f7d3ce66f
    - name: cuda-sandbox
      type: nemoclaw
      enabled: false
      agent: openclaw
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox:latest
      providers:
        - nvidia
    - name: toolbox
      type: generic
      enabled: false
      image: base
      providers:
        - nvidia
