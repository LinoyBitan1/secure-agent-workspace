apiVersion: saw.redhat.com/v1alpha1
kind: Sandboxes
metadata: {}
spec:
  sandboxes:
    - name: notebook
      type: openclaw
      enabled: true
      image: quay.io/rh-ai-quickstart/openclaw-openshell:latest
      providers:
        - nvidia
      # The harness bundle is mounted read-only at /sandbox/harness, as is:
      #   harnessRef: {name: <bundle>}   inline, from charts/saw-bom/harness/
      #                                  (digest: optional, checked when set);
      #                                  copied into a volume, edits refill it
      #   harnessRef: {image: ghcr.io/<owner>/saw-harness-<bundle>@sha256:<digest>}
      #                                  published by CI from harness-bundles/;
      #                                  mounted directly, a new digest
      #                                  recreates the sandbox
      harnessRef:
        name: ds-default
    - name: cuda-sandbox
      type: nemoclaw
      enabled: false
      agent: openclaw
      image: quay.io/rh-ai-quickstart/nemoclaw-sandbox:latest
      providers:
        - nvidia
    - name: toolbox
      type: generic
      enabled: false
      image: base
      providers:
        - nvidia
