apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
    - name: nvidia
      type: nvidia
      credentialSecret: inference
      credentialSecretKey: api_key
    - name: gmail-read-proxy
      type: gmail-read-proxy
      credentialKey: GOG_ACCESS_TOKEN
      credentialSecret: inter-vm-bearer
      credentialSecretKey: bearer
