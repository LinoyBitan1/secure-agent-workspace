apiVersion: saw.redhat.com/v1alpha1
kind: Providers
metadata:
  profile: data-science
spec:
  providers:
    - name: nvidia
      type: nvidia
      nemoclawProvider: build
      credentialSecret: inference
      credentialSecretKey: api_key
      modelSecretKey: model
    - name: brave
      type: brave
      credentialSecret: web-search
      credentialSecretKey: api_key
    # Test-cluster configuration: all three inference providers are enabled.
    - name: openai
      type: openai
      enabled: true
      credentialSecret: inference-openai
      credentialSecretKey: api_key
      modelSecretKey: model
    - name: anthropic
      type: anthropic
      enabled: true
      credentialSecret: inference-anthropic
      credentialSecretKey: api_key
      modelSecretKey: model
