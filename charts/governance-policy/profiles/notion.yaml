# Demo, beat 4: a capability an employee asked for through a ticket and an
# admin granted by merging this file. Read-only: GET requests to Notion's API
# only; the sandbox sees a placeholder, the proxy adds the real token.
id: notion
display_name: Notion
description: Read-only Notion API access for governed sandbox agents
category: other
credentials:
  - name: api_key
    description: Notion integration secret
    env_vars: [NOTION_API_KEY]
    required: true
    auth_style: bearer
    header_name: authorization
discovery:
  credentials: [api_key]
endpoints:
  - host: api.notion.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-only
binaries:
  - /usr/bin/curl
  - /usr/local/bin/curl
  # node: /usr/bin/node-<major> in the Hummingbird image, /usr/local/bin/node
  # in the NemoClaw image (the real path is what is matched).
  - /usr/bin/node
  - /usr/bin/node-*
  - /usr/local/bin/node
