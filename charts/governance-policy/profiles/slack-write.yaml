id: slack-write
display_name: Slack write token
description: Chat-write Slack user token retained by the integrations VM gateway
category: data
inference_capable: false

credentials:
  - name: user_token
    env_vars: [SLACK_WRITE_USER_TOKEN]
    required: true
    auth_style: bearer
    header_name: authorization
    refresh:
      strategy: static

discovery:
  credentials: [user_token]

endpoints:
  - host: slack.com
    port: 443
    protocol: rest
    enforcement: enforce
    access: read-write

binaries:
  - /sandbox/slack-send-service
