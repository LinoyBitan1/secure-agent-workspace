{{- if has "codex" (.Values.secrets | default list) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: codex
spec:
  refreshInterval: {{ .Values.refreshInterval }}
  secretStoreRef:
    name: {{ .Values.secretStoreRef.name }}
    kind: {{ .Values.secretStoreRef.kind }}
  target:
    name: codex
  dataFrom:
    - extract:
        key: {{ .Values.vaultPrefix }}/codex
{{- end }}
