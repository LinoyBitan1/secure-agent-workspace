# Governance interceptor for signed sandbox policies.
# Runs as a gRPC service that the OpenShell gateway calls
# to enforce admin-controlled, cryptographically signed policies.
#
# Policy data (profiles + sandbox policy) is managed by the
# governance-policy chart, which creates the ConfigMap this
# deployment mounts.
enabled: true
image: "quay.io/rh-ee-lbitan/governance-interceptor:latest"
# gRPC listen port
port: 18081
# Interceptor-to-gateway connection (for hot-reload push)
gatewayEndpoint: "https://127.0.0.1:17670"
# Fail-closed: deny all operations if interceptor is unreachable
failurePolicy: "fail_closed"
# Timeout for interceptor evaluation calls
timeout: "500ms"
resources:
  limits:
    memory: 256Mi
    cpu: 500m
  requests:
    memory: 128Mi
    cpu: 100m
