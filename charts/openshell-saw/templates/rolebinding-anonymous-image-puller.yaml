{{- if .Values.internalRegistry.allowAnonymousPull }}
# Lets the sandbox VM's container runtime (an external client to the cluster —
# it has no ServiceAccount pull secret) pull internally-built images (e.g.
# a self-built openclaw-openshell, see values.yaml's internalRegistry
# comment) from this namespace's registry without credentials. Standard
# OpenShift pattern for exposing a namespace's ImageStreams for anonymous
# pull; scoped to this namespace only.
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-anonymous-image-puller
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:unauthenticated
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:image-puller
{{- end }}
