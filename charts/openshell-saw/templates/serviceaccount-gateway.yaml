{{- if .Values.openshell.credentialDrivers.vault.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.openshell.credentialDrivers.vault.serviceAccountName }}
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
    app.kubernetes.io/component: vault-auth
{{- end }}
