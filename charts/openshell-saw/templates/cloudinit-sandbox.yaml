apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "openshell-sandbox.fullname" . }}-cloudinit-template
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
data:
  userData: |
    #cloud-config
    hostname: {{ include "openshell-sandbox.fullname" . }}
    fqdn: {{ include "openshell-sandbox.fullname" . }}.{{ .Release.Namespace }}.svc

    users:
      - default
      - name: cloud-user
        groups: [wheel]
        sudo: ["ALL=(ALL) NOPASSWD:ALL"]
        shell: /bin/bash
        ssh_authorized_keys:
          {{- $sshKey := include "openshell-sandbox.sshPublicKey" . }}
          {{- if $sshKey }}
          - {{ $sshKey | quote }}
          {{- else }}
          - "__SSH_PUBLIC_KEY__"
          {{- end }}

    write_files:
      - path: /etc/openshell/gateway.env
        owner: root:root
        permissions: "0644"
        content: |
          OPENSHELL_BIND_ADDRESS={{ .Values.openshell.bindAddress | quote }}
          OPENSHELL_SERVER_PORT=17670
          OPENSHELL_DRIVERS={{ .Values.containerRuntime }}
          OPENSHELL_SSH_GATEWAY_PORT=17670
          {{- if eq .Values.containerRuntime "podman" }}
          OPENSHELL_GRPC_ENDPOINT=https://host.containers.internal:17670
          {{- end }}
          OPENSHELL_TLS_CERT=/home/cloud-user/.local/state/openshell/tls/server/tls.crt
          OPENSHELL_TLS_KEY=/home/cloud-user/.local/state/openshell/tls/server/tls.key
          OPENSHELL_TLS_CLIENT_CA=/home/cloud-user/.local/state/openshell/tls/ca.crt
          {{- $oidcIssuer := include "openshell-sandbox.oidcIssuerUrl" . }}
          {{- if or .Values.oidc.token $oidcIssuer .Values.governance.enabled (eq .Values.containerRuntime "podman") }}
          OPENSHELL_CONFIG_FILE=/etc/openshell/gateway.toml
          {{- end }}
          {{- if or .Values.oidc.token $oidcIssuer }}
          OPENSHELL_ENABLE_MTLS_AUTH=true
          {{- end }}
          {{- $routeHost := include "openshell-sandbox.routeHost" . }}
          {{- if $routeHost }}
          OPENSHELL_ROUTE_FQDN={{ $routeHost }}
          {{- end }}

      - path: /etc/profile.d/nemoclaw-runtime.sh
        owner: root:root
        permissions: "0644"
        content: |
          export NEMOCLAW_GATEWAY_RUNTIME={{ .Values.containerRuntime }}

      {{- $oidcIssuer := include "openshell-sandbox.oidcIssuerUrl" . }}
      {{- if or .Values.oidc.token $oidcIssuer .Values.governance.enabled (eq .Values.containerRuntime "podman") }}
      - path: /etc/openshell/gateway.toml
        owner: root:root
        permissions: "0644"
        content: |
          {{- if eq .Values.containerRuntime "podman" }}
          [openshell.drivers.podman]
          supervisor_image = {{ .Values.openshell.supervisorImage | quote }}
          network_name = "openshell"
          image_pull_policy = "missing"
          grpc_endpoint = "https://host.containers.internal:17670"
          {{- end }}

          {{- if or .Values.oidc.token $oidcIssuer }}
          [openshell.gateway.oidc]
          issuer = {{ $oidcIssuer | quote }}
          audience = {{ .Values.oidc.clientId | quote }}

          [openshell.gateway.auth]
          allow_unauthenticated_users = false
          {{- end }}

          {{- if .Values.governance.enabled }}
          [openshell.gateway]
          provider_profile_sources = [
            { type = "interceptor", name = "governance" },
          ]

          [[openshell.gateway.interceptors]]
          name           = "governance"
          grpc_endpoint  = {{ .Values.governance.endpoint | default (printf "http://governance-interceptor.%s.svc.cluster.local:%v" .Release.Namespace (.Values.governance.port | default 18081)) | quote }}
          allow_insecure_transport = {{ .Values.governance.allowInsecureTransport | default true }}
          order          = 10
          failure_policy = {{ .Values.governance.failurePolicy | default "fail_closed" | quote }}
          binding_policy = "allowlist"
          timeout        = {{ .Values.governance.timeout | default "500ms" | quote }}

          [[openshell.gateway.interceptors.bindings]]
          rpc = "openshell.v1.OpenShell/CreateSandbox"
          phases = ["modify_operation", "validate"]

          [[openshell.gateway.interceptors.bindings]]
          rpc = "openshell.v1.OpenShell/CreateProvider"
          phases = ["validate"]

          [[openshell.gateway.interceptors.bindings]]
          rpc = "openshell.v1.OpenShell/UpdateConfig"
          phases = ["validate"]

          [[openshell.gateway.interceptors.bindings]]
          rpc = "openshell.v1.OpenShell/SubmitPolicyAnalysis"
          phases = ["validate"]
          {{- end }}
      {{- end }}

    runcmd:
      - |
        set -euo pipefail
        echo "=== Configuring OpenShell gateway ==="
        USER_NAME="cloud-user"
        USER_HOME="$(getent passwd "${USER_NAME}" | cut -d: -f6)"
        install -d -m 0750 -o root -g "${USER_NAME}" /etc/openshell
        install -d -m 0755 "${USER_HOME}/.config"
        chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config"
        install -d -m 0755 "${USER_HOME}/.config/openshell"
        cp /etc/openshell/gateway.env "${USER_HOME}/.config/openshell/gateway.env"
        if [[ -f /etc/openshell/gateway.toml ]]; then
          cp /etc/openshell/gateway.toml "${USER_HOME}/.config/openshell/gateway.toml"
        fi
        chown -R "${USER_NAME}:${USER_NAME}" "${USER_HOME}/.config/openshell"
        ROUTE_FQDN=$(grep -oP 'OPENSHELL_ROUTE_FQDN=\K.*' "${USER_HOME}/.config/openshell/gateway.env" || true)
        if [[ -n "${ROUTE_FQDN}" ]]; then
          echo "Adding route FQDN to gateway cert SANs: ${ROUTE_FQDN}"
          OVERRIDE_DIR="${USER_HOME}/.config/systemd/user/openshell-gateway.service.d"
          install -d -m 0755 -o "${USER_NAME}" -g "${USER_NAME}" "${OVERRIDE_DIR}"
          cat > "${OVERRIDE_DIR}/route-san.conf" <<SANEOF
        [Service]
        ExecStartPre=
        ExecStartPre=/usr/local/bin/openshell-gateway generate-certs --output-dir \${OPENSHELL_LOCAL_TLS_DIR} --server-san host.openshell.internal --server-san ${ROUTE_FQDN}
        SANEOF
          chown "${USER_NAME}:${USER_NAME}" "${OVERRIDE_DIR}/route-san.conf"
        fi
        if [[ "{{ .Values.containerRuntime }}" == "podman" ]]; then
          GATEWAY_ENV="${USER_HOME}/.config/openshell/gateway.env"
          SOCKET_PATH="/run/user/$(id -u "${USER_NAME}")/podman/podman.sock"
          sed -i '/^OPENSHELL_PODMAN_SOCKET=/d' "${GATEWAY_ENV}"
          echo "OPENSHELL_PODMAN_SOCKET=${SOCKET_PATH}" >> "${GATEWAY_ENV}"
          sudo -u "${USER_NAME}" \
            XDG_RUNTIME_DIR="/run/user/$(id -u "${USER_NAME}")" \
            DBUS_SESSION_BUS_ADDRESS="unix:path=/run/user/$(id -u "${USER_NAME}")/bus" \
            systemctl --user restart openshell-gateway.service || true
        fi
        systemctl start openshell-gateway-setup.service

    final_message: "openshell-saw cloud-init finished"
