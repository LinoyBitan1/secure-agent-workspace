{{- define "openshell-sandbox.validateEgressHost" -}}
{{- if contains "*" . }}
{{- fail (printf "egress host %q uses a wildcard; list the exact hostname (DNSNameResolver is not enabled)" .) }}
{{- end }}
{{- if regexMatch "^[0-9.]+$" . }}
{{- fail (printf "egress host %q is an IP address; a dnsName rule does not match an address, so list a hostname" .) }}
{{- end }}
{{- if not (regexMatch "^[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?(\\.[a-z0-9]([a-z0-9-]{0,61}[a-z0-9])?)+$" .) }}
{{- fail (printf "egress host %q must be a lowercase DNS name, with no scheme, port, or path" .) }}
{{- end }}
{{- end }}
{{- if .Values.egress.enabled }}
{{- $hosts := concat (.Values.egress.allow | default list) (.Values.egress.extraAllow | default list) }}
{{- if .Values.allowDriverConfig }}
{{- range (.Values.egress.harnessAllow | default list) }}
{{- if not (has . $hosts) }}{{- $hosts = append $hosts . }}{{- end }}
{{- end }}
{{- end }}
{{- if eq (.Values.signing.mode | default "warn") "enforce" }}
{{- range (.Values.egress.signingAllow | default list) }}
{{- if not (has . $hosts) }}{{- $hosts = append $hosts . }}{{- end }}
{{- end }}
{{- end }}
{{- range $hosts }}
{{- include "openshell-sandbox.validateEgressHost" . }}
{{- end }}
{{- $keycloak := include "openshell-sandbox.keycloakRouteHost" . | trim }}
{{- if $keycloak }}
{{- include "openshell-sandbox.validateEgressHost" $keycloak }}
{{- end }}
apiVersion: k8s.ovn.org/v1
kind: EgressFirewall
metadata:
  name: default
  labels:
    {{- include "openshell-sandbox.labels" . | nindent 4 }}
spec:
  egress:
    # The ingress router (443, 80) on node addresses. The VM does not call
    # the Kubernetes API, so 6443 is not open. Kubelet, SSH, and NodePorts
    # are not either. A load-balancer IP is not a node address, so this
    # rule does not cover that path; the Keycloak host does.
    - type: Allow
      to:
        nodeSelector:
          matchLabels:
            kubernetes.io/os: linux
      ports:
        - protocol: TCP
          port: 443
        - protocol: TCP
          port: 80
    {{- range $hosts }}
    - type: Allow
      to:
        dnsName: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 443
    {{- end }}
    {{- /* egress.allow and extraAllow are TCP 443. A custom issuer port still needs its own rule. */}}
    {{- $kcPort := include "openshell-sandbox.keycloakRoutePort" . | trim }}
    {{- $keycloakOn443 := and (eq $kcPort "443") (has $keycloak $hosts) }}
    {{- if and $keycloak (not $keycloakOn443) }}
    - type: Allow
      to:
        dnsName: {{ $keycloak | quote }}
      ports:
        - protocol: TCP
          port: {{ $kcPort }}
    {{- end }}
    {{- /* CDI imports the disk in this namespace: an http(s) URL, or a docker:// image on a
         registry outside the cluster. Skip a host and port already allowed. */}}
    {{- $seen := list }}
    {{- range $url := list ($.Values.source.httpURL | default "") ($.Values.source.goldenImageURL | default "") ($.Values.source.registryURL | default "") }}
    {{- /* pullMethod node (the default): the node's container runtime pulls a docker:// image, outside this namespace's firewall. */}}
    {{- $nodePull := and (hasPrefix "docker://" ($url | trim)) (ne ($.Values.source.pullMethod | default "node") "pod") }}
    {{- $pair := "" }}
    {{- if not $nodePull }}{{- $pair = include "openshell-sandbox.httpHostPort" $url | trim }}{{- end }}
    {{- if and $pair (not (has $pair $seen)) }}
    {{- $seen = append $seen $pair }}
    {{- $parts := splitList " " $pair }}
    {{- $diskHost := index $parts 0 }}
    {{- $diskPort := index $parts 1 }}
    {{- $listed := and (eq $diskPort "443") (has $diskHost $hosts) }}
    {{- $sameKeycloak := and (eq $diskHost $keycloak) (eq $diskPort $kcPort) }}
    {{- if and (not $listed) (not $sameKeycloak) }}
    {{- include "openshell-sandbox.validateEgressHost" $diskHost }}
    - type: Allow
      to:
        dnsName: {{ $diskHost | quote }}
      ports:
        - protocol: TCP
          port: {{ $diskPort }}
    {{- end }}
    {{- end }}
    {{- end }}
    - type: Deny
      to:
        cidrSelector: 0.0.0.0/0
    - type: Deny
      to:
        cidrSelector: "::/0"
{{- end }}
