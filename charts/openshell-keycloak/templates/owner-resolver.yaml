{{- if .Values.ownerResolver.enabled }}
{{- $r := .Values.ownerResolver }}
{{- $kc := .Values.keycloak.existing | default .Values.keycloak.name }}
{{- $url := $r.keycloakUrl | default (printf "http://%s-service.%s.svc:8080" $kc .Release.Namespace) }}
{{- $name := $r.name }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["namespaces"]
    verbs: ["list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}-{{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}-{{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}
data:
  owner-resolver.py: |
{{ .Files.Get "files/owner-resolver.py" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ $name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ $name }}
      annotations:
        checksum/script: {{ .Files.Get "files/owner-resolver.py" | sha256sum }}
    spec:
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: bootstrap
          image: {{ $r.image | quote }}
          command: ["python3", "/scripts/owner-resolver.py", "bootstrap"]
          env:
            - name: KC_URL
              value: {{ $url | quote }}
            - name: REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: CLIENT_ID
              value: {{ $r.clientId | quote }}
            - name: ADMIN_DIR
              value: /admin
            - name: OUT
              value: /run/resolver/client-secret
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: admin
              mountPath: /admin
              readOnly: true
            - name: run
              mountPath: /run/resolver
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      containers:
        - name: resolver
          image: {{ $r.image | quote }}
          command: ["python3", "/scripts/owner-resolver.py", "run"]
          env:
            - name: KC_URL
              value: {{ $url | quote }}
            - name: REALM
              value: {{ .Values.keycloak.realm | quote }}
            - name: CLIENT_ID
              value: {{ $r.clientId | quote }}
            - name: SECRET_FILE
              value: /run/resolver/client-secret
            - name: INTERVAL
              value: {{ $r.intervalSeconds | quote }}
            - name: NAMESPACE_SELECTOR
              value: {{ $r.namespaceSelector | quote }}
          volumeMounts:
            - name: script
              mountPath: /scripts
            - name: run
              mountPath: /run/resolver
              readOnly: true
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: script
          configMap:
            name: {{ $name }}
        - name: admin
          secret:
            secretName: {{ $r.adminSecret | default (printf "%s-initial-admin" $kc) }}
        - name: run
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
{{- end }}
