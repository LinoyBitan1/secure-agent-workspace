{{- /* Only imported users without explicit passwords need this Secret. */ -}}
{{- $users := .Values.keycloak.users | default list -}}
{{- if .Values.demo.enabled -}}
{{- $users = concat $users (.Values.demo.users | default list) -}}
{{- end -}}
{{- $needsPassword := false -}}
{{- range $users -}}
{{- if not .password -}}{{- $needsPassword = true -}}{{- end -}}
{{- end -}}
{{- if and .Values.keycloak.userPasswords.externalSecret.enabled $needsPassword }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.keycloak.userPasswords.secretName }}
  annotations:
    argocd.argoproj.io/sync-wave: "-1"
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: {{ .Values.keycloak.userPasswords.externalSecret.secretStoreRef.name }}
    kind: {{ .Values.keycloak.userPasswords.externalSecret.secretStoreRef.kind }}
  target:
    name: {{ .Values.keycloak.userPasswords.secretName }}
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: {{ .Values.keycloak.userPasswords.externalSecret.vaultKey }}
{{- end }}
