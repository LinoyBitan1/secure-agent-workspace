apiVersion: build.openshift.io/v1
kind: BuildConfig
metadata:
  name: {{ (split ":" .Values.output.imageStreamTag)._0 }}
  labels:
    {{- include "nemoclaw-cli-imagestream.labels" . | nindent 4 }}
spec:
  source:
    type: Git
    git:
      uri: {{ .Values.source.git.uri }}
      ref: {{ .Values.source.git.ref }}
    dockerfile: |
      FROM {{ .Values.build.nodeImage }} AS builder
      ENV NPM_CONFIG_AUDIT=false \
          NPM_CONFIG_FUND=false \
          NPM_CONFIG_UPDATE_NOTIFIER=false
      WORKDIR /opt/nemoclaw
      COPY package.json package-lock.json ./
      RUN npm ci --ignore-scripts
      COPY nemoclaw/package.json nemoclaw/package-lock.json nemoclaw/tsconfig.json nemoclaw/tsconfig.shared.json ./nemoclaw/
      RUN cd nemoclaw && npm ci --ignore-scripts
      COPY . .
      # Preserve the externally supervised OIDC gateway registration during
      # onboarding instead of replacing it with a local mTLS registration.
      RUN node -e 'const fs=require("node:fs");const p="src/lib/onboard/gateway-host-runtime.ts";let s=fs.readFileSync(p,"utf8");const a="const added = await deps.lifecycle.registerGateway({ ...request, endpoint: owner.endpoint });";const b=`const added = process.env.NEMOCLAW_PRESERVE_GATEWAY_REGISTRATION === "1" ? ({ ok: true, state: "completed" } as const) : await deps.lifecycle.registerGateway({ ...request, endpoint: owner.endpoint });`;if(!s.includes(a))throw new Error("NemoClaw gateway attach source changed; update the compatibility patch");fs.writeFileSync(p,s.replace(a,b));'
      # v0.0.127 reads the default gateway port before the external gateway
      # environment is applied. Honor the configured external port at load.
      RUN node -e 'const fs=require("node:fs");const p="src/lib/onboard.ts";let s=fs.readFileSync(p,"utf8");const a="let GATEWAY_PORT = DEFAULT_GATEWAY_PORT;";const b="let GATEWAY_PORT = envInt(\"NEMOCLAW_GATEWAY_PORT\", DEFAULT_GATEWAY_PORT);";if(!s.includes(a))throw new Error("NemoClaw gateway port source changed; update the compatibility patch");fs.writeFileSync(p,s.replace(a,b));'
      RUN git rev-parse HEAD > .source-revision 2>/dev/null || echo "0000000000000000000000000000000000000000" > .source-revision
      RUN npm run build:cli
      # Fail the image build if the generated bundle dropped the port patch.
      RUN node -e 'const fs=require("node:fs");const p="dist/lib/onboard.js";let s=fs.readFileSync(p,"utf8");const a="let GATEWAY_PORT = DEFAULT_GATEWAY_PORT;";const b="let GATEWAY_PORT = envInt(\"NEMOCLAW_GATEWAY_PORT\", DEFAULT_GATEWAY_PORT);";if(s.includes(a)){s=s.replace(a,b);fs.writeFileSync(p,s);}if(!s.includes(b))throw new Error("compiled NemoClaw bundle does not honor NEMOCLAW_GATEWAY_PORT");'

      FROM {{ .Values.build.nodeImage }}
      WORKDIR /opt/nemoclaw
      COPY --from=builder /opt/nemoclaw/package.json /opt/nemoclaw/package-lock.json ./
      RUN npm ci --omit=dev --ignore-scripts
      COPY --from=builder /opt/nemoclaw/dist/ ./dist/
      COPY --from=builder /opt/nemoclaw/bin/ ./bin/
      COPY --from=builder /opt/nemoclaw/nemoclaw/dist/ ./nemoclaw/dist/
      COPY --from=builder /opt/nemoclaw/agents/ ./agents/
      COPY --from=builder /opt/nemoclaw/scripts/ ./scripts/
      COPY --from=builder /opt/nemoclaw/nemoclaw-blueprint/ ./nemoclaw-blueprint/
      COPY --from=builder /opt/nemoclaw/managed-inference/ ./managed-inference/
      RUN sed -i 's/max_openshell_version: "0.0.85"/max_openshell_version: "{{ .Values.build.maxOpenshellVersion | default "0.0.99" }}"/' ./nemoclaw-blueprint/blueprint.yaml
      COPY --from=builder /opt/nemoclaw/schemas/ ./schemas/
      COPY --from=builder /opt/nemoclaw/Dockerfile ./Dockerfile
      COPY --from=builder /opt/nemoclaw/tsconfig.runtime-preloads.json ./tsconfig.runtime-preloads.json
      # Patch inference route parser to match both "Gateway inference:" and "Inference:" output formats
      RUN sed -i 's|/\^Gateway inference:\\\\s\*\$/i|/^(Gateway )?[Ii]nference:\\s*$/i|' ./dist/lib/inference/config.js
      ENTRYPOINT ["node", "/opt/nemoclaw/bin/nemoclaw.js"]
  strategy:
    type: Docker
    dockerStrategy: {}
  output:
    to:
      kind: ImageStreamTag
      name: {{ .Values.output.imageStreamTag }}
  triggers: []
