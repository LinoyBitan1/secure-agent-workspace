source:
  # Supplied by make sandbox-build only after its discovery build completes.
  discoveryImage: ""
  git:
    uri: "https://github.com/NVIDIA/NemoClaw.git"
    ref: "95d6505265ba1f2cb05355f83786353e654de096" # v0.0.132

build:
  discoveryNodeVersion: "24.19.0"
  targetArch: "amd64"
  # NemoClaw v0.0.132 amd64 base image.
  baseImage: "ghcr.io/nvidia/nemoclaw/sandbox-base:v0.0.132"
  model: "claude-sonnet-4-6"
  inferenceBaseUrl: "https://inference.local/v1"
  inferenceApi: "openai-completions"
  contextWindow: "200000"
  maxTokens: "8192"
  reasoning: "false"
  toolDisclosure: "progressive"
  agentTimeout: "600"
  webSearchEnabled: "1"

output:
  imageStreamTag: "nemoclaw-sandbox:latest"
