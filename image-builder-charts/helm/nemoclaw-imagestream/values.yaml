source:
  git:
    uri: "https://github.com/NVIDIA/NemoClaw.git"
    # OpenShell 0.0.116-compatible revision with native rootless Podman onboarding.
    ref: "f47724f29838fe08898993fad1c8c6b7fcb3e080"

build:
  targetArch: "amd64"
  baseImage: "ghcr.io/nvidia/nemoclaw/sandbox-base:latest"
  model: "claude-sonnet-4-6"
  inferenceBaseUrl: "https://inference.local/v1"
  inferenceApi: "openai-completions"
  contextWindow: "200000"
  maxTokens: "8192"
  reasoning: "false"
  toolDisclosure: "progressive"
  agentTimeout: "600"
  webSearchEnabled: "1"

output:
  imageStreamTag: "nemoclaw-sandbox:latest"
