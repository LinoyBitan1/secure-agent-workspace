source:
  git:
    uri: "https://github.com/NVIDIA/NemoClaw.git"
    ref: "37ca4cb4220265c2a12b9d9b8a120d0d23a338dd" # v0.0.127

build:
  targetArch: "amd64"
  # NemoClaw v0.0.127 amd64 base image.
  baseImage: "ghcr.io/nvidia/nemoclaw/sandbox-base:v0.0.127"
  model: "claude-sonnet-4-6"
  inferenceBaseUrl: "https://inference.local/v1"
  inferenceApi: "openai-completions"
  contextWindow: "200000"
  maxTokens: "8192"
  reasoning: "false"
  toolDisclosure: "progressive"
  agentTimeout: "600"
  webSearchEnabled: "1"

output:
  imageStreamTag: "nemoclaw-sandbox:latest"
