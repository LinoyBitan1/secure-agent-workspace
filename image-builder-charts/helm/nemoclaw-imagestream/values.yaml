source:
  git:
    uri: "https://github.com/NVIDIA/NemoClaw.git"
    # Pinned peeled commit for the latest published NemoClaw release (v0.0.123).
    ref: "f75f722bb4a1ec9642c8df36c8924e24500d78f0"

build:
  targetArch: "amd64"
  # Pin the base built from the same NemoClaw release as the source commit.
  # Using :latest can drift and fail the release's security inventory checks.
  baseImage: "ghcr.io/nvidia/nemoclaw/sandbox-base@sha256:8562697ff795aef2ca809e6a9310e8712ee453f2565657ed6b13bc080fbb6973"
  model: "claude-sonnet-4-6"
  inferenceBaseUrl: "https://inference.local/v1"
  inferenceApi: "openai-completions"
  contextWindow: "200000"
  maxTokens: "8192"
  reasoning: "false"
  toolDisclosure: "progressive"
  agentTimeout: "600"
  webSearchEnabled: "1"

output:
  imageStreamTag: "nemoclaw-sandbox:latest"
