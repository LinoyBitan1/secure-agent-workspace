# Integrations VM — runs credential proxy sandboxes, no agent code.
# Deploy: helm install saw-integ charts/openshell-saw -f deploy/two-vm/integrations-values.yaml
sandboxName: saw-integ
role: integrations

containerRuntime: podman
onboardCli: openclaw

openshell:
  gatewayImage: ghcr.io/nvidia/openshell/gateway:0.0.103
  supervisorImage: ghcr.io/nvidia/openshell/supervisor:0.0.103
  version: "0.0.103"
  pipIndexUrl: ""

vm:
  cores: 2
  memory: 4Gi
  diskSize: 40Gi

route:
  enabled: false
  dashboard: false
  webui: false

dashboard:
  enabled: false

governance:
  enabled: false

service:
  extraPorts:
    - name: mail-read
      port: 18080
      targetPort: 18080
    - name: slack-read
      port: 18081
      targetPort: 18081
    - name: slack-bot
      port: 18082
      targetPort: 18082
    - name: web-research
      port: 18083
      targetPort: 18083

networkPolicy:
  peerLabel: saw-agent
  allowedPorts:
    - 18080
    - 18081
    - 18082
    - 18083
